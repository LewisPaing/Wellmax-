<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — WellMax</title>
  <link rel="icon" href="/images/favicon.ico">
  <style>
    :root { color-scheme: dark; font-family: "DM Sans", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff; background: radial-gradient(circle at 75% 25%, #5c25a9, transparent 38%), #09070f; }
    main { width: min(680px, 100%); }
    img { width: 180px; height: auto; margin-bottom: 72px; }
    p:first-of-type { color: #b68cff; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0 20px; font-size: clamp(48px, 10vw, 96px); line-height: .95; letter-spacing: -.06em; }
    p { max-width: 520px; color: #cbc4d8; font-size: 18px; line-height: 1.6; }
    a { display: inline-flex; margin-top: 24px; padding: 15px 22px; border-radius: 999px; color: #fff; background: #7b3fe4; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
  <script src="/js/analytics.js" defer></script>
</head>
<body>
  <main>
    <img src="/images/wellmax-brand.png" alt="WellMax Advertising and Media">
    <p>Error 404</p>
    <h1>This page missed its mark.</h1>
    <p>The link may be outdated or the page may have moved. Return to WellMax and continue exploring our work.</p>
    <a href="/">Return to the homepage&nbsp; ↗</a>
  </main>
</body>
</html>
