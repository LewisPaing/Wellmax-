<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f2cff">
  <title>WellMax | Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 82% 12%,#58259a 0,transparent 42%),linear-gradient(145deg,#07030d,#19092c 60%,#310d58);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,480px);padding:34px;border:1px solid rgba(255,255,255,.22);border-radius:32px;background:rgba(255,255,255,.09);box-shadow:0 24px 80px rgba(0,0,0,.35);backdrop-filter:blur(24px)}img{width:72px;height:72px;border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.28)}h1{font-size:clamp(2rem,8vw,3.4rem);line-height:1;margin:28px 0 14px}p{color:rgba(255,255,255,.76);font-size:1.05rem;line-height:1.55}button{margin-top:14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:14px 20px;background:#fff;color:#32105c;font:700 1rem inherit;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="/images/app-icon-192.png" alt="WellMax">
    <h1>You’re offline.</h1>
    <p>Reconnect to continue to WellMax services, portfolio and your secure client portal.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
