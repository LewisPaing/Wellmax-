name: WellMax
options:
  bundleIdPrefix: com.wellmaxagency
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  WellMax:
    type: application
    platform: iOS
    sources:
      - path: WellMax
    preBuildScripts:
      - name: Restore App Icon
        basedOnDependencyAnalysis: false
        script: |
          ICON_DIR="$SRCROOT/WellMax/Assets.xcassets/AppIcon.appiconset"
          ICON_FILE="$ICON_DIR/AppIcon-1024.png"
          if [ ! -f "$ICON_FILE" ]; then
            cat "$ICON_DIR"/AppIcon-profile.png.base64.part-* | /usr/bin/base64 -D -o "$ICON_FILE"
          fi
    info:
      path: WellMax/Supporting/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wellmaxagency.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - WellMaxTests
  WellMaxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WellMaxTests
    dependencies:
      - target: WellMax
